[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certified-equilibrium-layers"
version = "0.0.0"
description = "Certified comparative statics for conservation-law equilibrium layers, applied to siRNA off-target competition"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "certified-equilibrium-layers authors" }]
keywords = ["siRNA", "GNN", "off-target", "PAC-Bayes", "interpretability"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

# Pinned core deps. Versions chosen for Python 3.11 compatibility and for the
# CCMP -> CASCADE extension path. Bumping a pin requires updating CI and the
# verify/ scripts that depend on it.
dependencies = [
    "torch==2.3.1",
    "torch-geometric==2.5.3",
    "numpy>=1.26,<2.0",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "tqdm==4.66.4",
    "pyyaml==6.0.1",
    "pyarrow==16.1.0",
    # ViennaRNA Python bindings. Installed via the PyPI 'ViennaRNA' wheel.
    # If unavailable on the target platform, install the system package and
    # expose the bindings on PYTHONPATH; this dep stays pinned.
    "ViennaRNA==2.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "ruff==0.5.5",
    "pre-commit==3.7.1",
    # Plotting for the verify/ scripts (decay-vs-envelope figures). Optional at
    # runtime: the library imports it lazily and degrades to CSV-only output.
    "matplotlib==3.9.2",
]

[project.urls]
Homepage = "https://github.com/shadi97kh/certified-equilibrium-layers"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cel*", "certification*"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# Ruff: lint + format. Single source of truth for both.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "verify", "scripts"]
extend-exclude = ["paper", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
"verify/**" = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]
filterwarnings = [
    # Benign torch sparse-tensor notice raised when building the propagation operator.
    "ignore:Sparse invariant checks are implicitly disabled:UserWarning",
]
