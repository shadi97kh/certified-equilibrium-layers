name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev tooling
        # Heavy deps (torch, PyG, ViennaRNA) are deferred to a follow-up job
        # so the lint+test loop stays fast. The lightweight data-layer deps
        # are installed here because the data tests exercise them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ruff==0.5.5" \
            "pytest==8.2.2" \
            "numpy>=1.26,<2.0" \
            "scipy==1.13.1" \
            "pandas==2.2.2" \
            "scikit-learn==1.5.1" \
            "pyarrow==16.1.0"

      - name: Install package (no extras)
        # Editable install without resolving optional deps so 'import cel'
        # works in tests without pulling torch + PyG.
        run: |
          python -m pip install --no-deps -e .

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Forbid em-dashes
        run: |
          git ls-files -z | xargs -0 python scripts/check_no_em_dash.py

      - name: Forbid synthetic data on AAAI reported-number paths
        run: python scripts/assert_no_synthetic.py

      - name: Pytest
        run: pytest -q
